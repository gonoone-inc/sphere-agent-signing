# No checkout is needed: the signing repository contains no application source.
name: Sphere public Linux signing
on:
  workflow_dispatch:
    inputs:
      request_tag:
        required: true
        type: string
      input_sha256:
        required: true
        type: string
permissions:
  contents: write
  id-token: write
jobs:
  sign:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Fetch, validate and sign the exact requested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUEST_TAG: ${{ inputs.request_tag }}
          INPUT_SHA256: ${{ inputs.input_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re,subprocess,hashlib,zipfile,pathlib
          tag=os.environ['REQUEST_TAG']
          digest=os.environ['INPUT_SHA256']
          if not re.fullmatch(r'sign-[0-9a-f]{32}',tag) or not re.fullmatch(r'[0-9a-f]{64}',digest):
              raise SystemExit('Invalid request')
          subprocess.run(['gh','release','download',tag,'--pattern','linux-unsigned.zip'],check=True)
          data=pathlib.Path('linux-unsigned.zip').read_bytes()
          if hashlib.sha256(data).hexdigest()!=digest: raise SystemExit('Input digest mismatch')
          names={f'sphere-agent-linux-{a}{s}' for a in ('amd64','arm64') for s in ('','.tar.gz')}
          with zipfile.ZipFile('linux-unsigned.zip') as z:
              if set(z.namelist())!=names or len(z.infolist())!=len(names): raise SystemExit('Unexpected input files')
              for item in z.infolist():
                  if item.file_size > 256*1024*1024: raise SystemExit('Artifact too large')
                  pathlib.Path(item.filename).write_bytes(z.read(item))
          for name in sorted(names):
              subprocess.run(['cosign','sign-blob','--yes',name,'--bundle',name+'.sigstore.json'],check=True)
          with zipfile.ZipFile('linux-signatures.zip','w') as z:
              for name in sorted(names): z.write(name+'.sigstore.json')
          subprocess.run(['gh','release','upload',tag,'linux-signatures.zip'],check=True)
          PY
